name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-quality:
    name: PHP — Lint, Tests, Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, fileinfo, gd, zip, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer security audit
        run: composer audit --no-dev # ZAD-2.5: traktuj jako blokujące (brak `|| true`)

      - name: PHP syntax check
        run: |
          find src public bin -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: PHPStan static analysis
        run: |
          if [ -f vendor/bin/phpstan ]; then
            ./vendor/bin/phpstan analyse --no-progress
          else
            echo "PHPStan not installed — skipping"
          fi

      - name: PHPUnit tests
        run: |
          if [ -f vendor/bin/phpunit ]; then
            ./vendor/bin/phpunit tests/ --no-coverage
          else
            echo "PHPUnit not installed — skipping"
          fi
